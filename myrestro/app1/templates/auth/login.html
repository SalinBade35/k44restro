<body>
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
<!-- From Uiverse.io by Smit-Prajapati --> 
<div class="container">
        <!-- <div><button><a href="{% url 'index' %}">X</a></button></div> -->
    <div class="heading">Log In</div>
        <div class="close-button">
        <a href="{% url 'index' %}">&#10005;</a>
        </div>

    <form method="post" action="{% url 'log_in' %}" class="form">
        {% csrf_token %}
      <input required="" class="input" type="text" name="username" id="email" placeholder="username">

      <input required="" class="input" type="password" name="password" id="password" placeholder="Password">

         <div class="flex-row" name="remember_me">
      <div>
      <input type="checkbox">
      <label>Remember me </label>
      </div>

    </div>
      <span class="forgot-password"><a href="{% url 'password_reset' %}">Forgot Password ?</a></span>
     
      <input class="login-button" type="submit" value="Login">
      
    </form>
    <div class="social-account-container">
        <span class="title">Or Sign in with</span>
        <div class="social-accounts">

        <button class="social-button google" onclick="window.location.href='{% url 'social:begin' 'google-oauth2' %}'">

            <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 488 512">
              <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"></path>
            </svg>
        </button>



        </div>
      </div>
      <span class="agreement"><a href="#">Learn user licence agreement</a></span>
  </div>
        </div>
        <div class="col-3"></div>
    </div>

    <div>
        {% if messages %}
                {% for message in messages %}
            {% if message.tags == 'error' %}
            <script>
                alertify.set('notifier', 'position', 'bottom-right');
                alertify.error('{{ message|escapejs }}');
            </script>
            {% else %}
            <script>
                alertify.set('notifier', 'position', 'bottom-right');
                alertify.success('{{ message|escapejs }}');
            </script>
            {% endif %}
            {% endfor %}
        {% endif %}
    </div>

</body>
</html>
